<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Lâminas do Caos — herói procedural (DeepSeek)</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f0d; color: #e8dfcd;
    font: 14px/1.45 "Trebuchet MS", system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { background: #123028; image-rendering: auto; box-shadow: 0 0 60px rgba(0,0,0,0.8);
    max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  #hint {
    position: fixed; left: 50%; bottom: 6px; transform: translateX(-50%);
    font: 12px/1.4 monospace; color: #9fb0a0; opacity: .8; pointer-events: none; white-space: nowrap;
  }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0b0f0d; font: 600 18px monospace; color: #cfc3a5; z-index: 5; }
</style>
</head>
<body>
<div id="stage"><canvas id="cv" width="1280" height="720"></canvas></div>
<div id="hint">WASD/setas mover · mouse ou J atacar (combo A1→A2→A3) · ESPAÇO/E investida · Q giro · R fúria · F1 hitboxes · P pausa</div>
<div id="boot">pintando o herói procedural…</div>
<!--SCRIPTS-->
<script>
(function () {
  var cv = document.getElementById('cv');
  function fit() {
    var k = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    cv.style.width = Math.floor(1280 * k) + 'px';
    cv.style.height = Math.floor(720 * k) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();
  DS.showPerf = true;
  if (/[?&]debug=1/.test(location.search)) DS.game.state.debug = true;
  if (/[?&]spawn=([0-9]+)/.test(location.search)) DS.game.spawnCount = Number(RegExp.$1);
  if (/[?&]bench=([0-9.]+)/.test(location.search)) { DS.bench = Number(RegExp.$1); DS.game.benchFrames = []; DS.game.benchT = 0; }
  if (/[?&]benchloop=([0-9]+)/.test(location.search)) DS.benchLoop = Number(RegExp.$1);
  if (/[?&]sheet=([a-z]+)/.test(location.search)) DS.game.sheet = RegExp.$1;
  // ?no=props,fx  -> desliga camadas (medição de performance por camada)
  DS.flags = { ground: true, props: true, fx: true, hud: true, enemies: true, hero: true };
  if (/[?&]no=([a-z,]+)/.test(location.search)) {
    for (const k of RegExp.$1.split(',')) if (k in DS.flags) DS.flags[k] = false;
  }
  if (/[?&]freeze=([a-z]+):([0-9]+):([0-9.]+)/.test(location.search)) {
    DS.game.freeze = { kind: RegExp.$1, idx: Number(RegExp.$2), u: Number(RegExp.$3) };
  }
  DS.game.init(cv);
  var boot = document.getElementById('boot');
  var iv = setInterval(function () {
    if (window.__DS_READY) { boot.style.display = 'none'; clearInterval(iv); }
  }, 60);
  window.__DS_STARTED = true;
})();
</script>
</body>
</html>
