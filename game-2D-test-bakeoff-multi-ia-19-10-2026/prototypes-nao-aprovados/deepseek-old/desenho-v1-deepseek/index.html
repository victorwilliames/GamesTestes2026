<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Lâminas do Caos — herói procedural (DeepSeek)</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f0d; color: #e8dfcd;
    font: 14px/1.45 "Trebuchet MS", system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { background: #123028; image-rendering: auto; box-shadow: 0 0 60px rgba(0,0,0,0.8);
    max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  #hint {
    position: fixed; left: 50%; bottom: 6px; transform: translateX(-50%);
    font: 12px/1.4 monospace; color: #9fb0a0; opacity: .8; pointer-events: none; white-space: nowrap;
  }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0b0f0d; font: 600 18px monospace; color: #cfc3a5; z-index: 5; }
</style>
</head>
<body>
<div id="stage"><canvas id="cv" width="1280" height="720"></canvas></div>
<div id="hint">WASD/setas mover · mouse ou J atacar (combo A1→A2→A3) · ESPAÇO/E investida · Q giro · R fúria · F1 hitboxes · P pausa</div>
<div id="boot">pintando o herói procedural…</div>
<script>
/* ============================================================================
 * LÂMINAS DO CAOS — herói 2D procedural (Canvas 2D puro, sem sprites)
 * Gerado por tools/build.mjs a partir de src/{00..10}-*.js
 * Ordem: 00-core.js -> 01-head.js -> 02-body.js -> 03-limbs.js -> 04-weapon.js -> 05-skeleton.js -> 06-hero.js -> 07-arena.js -> 08-enemy.js -> 09-combat.js -> 10-game.js
 * ========================================================================== */

/* ---------- 00-core.js ---------- */
/* ============================================================================
 * 00-core.js — Núcleo do renderer procedural do @deepseek
 * Paleta amostrada das referências oficiais, RNG determinístico, paths
 * amostráveis (para contorno à mão) e o kit de pincéis pintados.
 * Nenhuma imagem é usada pelo renderer: tudo é geometria + pintura em código.
 * ========================================================================== */
window.DS = window.DS || {};
(function (DS) {
  'use strict';

  /* ---------------------------------------------------------------- paleta */
  // Valores tirados por observação das folhas oficiais hero-part-* e hero-idle-*.
  DS.P = {
    // tinta / contorno
    ink: '#1d1113', ink2: '#3a1f1c', inkSoft: '#5d3227', inkWarm: '#8a4a34',
    // pele
    skin: '#f2ab72', skinLit: '#ffd6a2', skinMid: '#e8935b', skinShade: '#c9714a',
    skinDeep: '#a3553a', skinBlood: '#c0453a',
    // cabelo
    hair: '#3b2620', hairMid: '#5d3a2b', hairLit: '#8a543a', hairHi: '#c07f52', hairDeep: '#20161a',
    // vermelho (lenço, capa, tecido)
    red: '#b3151b', redLit: '#e33025', redMid: '#8d0f16', redDeep: '#54060f', redHot: '#ff5a33',
    // couro
    lea: '#4b3229', leaMid: '#6d4632', leaLit: '#9c6a48', leaDeep: '#241719', leaDark: '#33221f',
    // metal / lâmina
    steel: '#43383c', steelLit: '#cdb3ab', steelHot: '#e0703a', steelDeep: '#1b151a', steelMid: '#6d5b58',
    // fogo / sangue
    fire: '#ff8a1e', fireHot: '#ffd75c', fireRed: '#d21f16', blood: '#8d0f10', bloodLit: '#c8231c',
    // osso
    bone: '#e7d6b7', boneMid: '#c2a883', boneDeep: '#8a6f57', boneDark: '#3a2b25',
    // arena
    grass: '#7d9c46', grassLit: '#a8c162', grassDeep: '#4d6b30',
    sand: '#dcb977', sandLit: '#efd79c', sandDeep: '#b78748',
    water: '#1f6f96', waterLit: '#57b6cc', waterDeep: '#0f4a72', foam: '#e8f4f2',
    rock: '#8f8b83', rockLit: '#c0bab0', rockDeep: '#565049',
    wood: '#a5703f', woodLit: '#c9975c', woodDeep: '#5f3d22',
  };

  /* ------------------------------------------------------------------- RNG */
  DS.rng = function (seed) {
    let s = (seed >>> 0) || 0x9e3779b9;
    return function () {
      s ^= s << 13; s >>>= 0;
      s ^= s >>> 17;
      s ^= s << 5; s >>>= 0;
      return s / 4294967296;
    };
  };
  DS.rrange = function (rnd, a, b) { return a + (b - a) * rnd(); };
  DS.pick = function (rnd, arr) { return arr[Math.floor(rnd() * arr.length) % arr.length]; };

  /* --------------------------------------------------------- matemática útil */
  DS.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  DS.lerp = (a, b, t) => a + (b - a) * t;
  DS.smooth = (t) => t * t * (3 - 2 * t);
  DS.easeIn = (t) => t * t;
  DS.easeOut = (t) => 1 - (1 - t) * (1 - t);
  DS.easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
  DS.easeOutBack = (t) => 1 + 2.2 * Math.pow(t - 1, 3) + 1.4 * Math.pow(t - 1, 2);
  DS.wrap = (v, n) => ((v % n) + n) % n;
  DS.angleLerp = function (a, b, t) {
    let d = ((b - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    return a + d * t;
  };
  // ruído 1D suave determinístico (para contorno trêmulo e ondulações)
  DS.noise1 = function (x, seed) {
    const i = Math.floor(x), f = x - i;
    const h = (n) => {
      let v = Math.sin((n * 127.1 + (seed || 1) * 311.7) * 0.01745) * 43758.5453;
      return v - Math.floor(v);
    };
    const a = h(i), b = h(i + 1), t = DS.smooth(f);
    return a + (b - a) * t;
  };
  DS.noise2 = function (x, y, seed) {
    let v = Math.sin((x * 127.1 + y * 311.7 + (seed || 1) * 74.7) * 0.013) * 43758.5453;
    return v - Math.floor(v);
  };

  /* ------------------------------------------------- paths amostráveis (RPath)
   * Path2D não permite leitura de pontos, então gravamos os comandos para
   * poder reamostrar o contorno e desenhar tinta com espessura irregular. */
  function RPath() {
    const cmds = [];
    const api = {
      cmds,
      M(x, y) { cmds.push(['M', x, y]); return api; },
      L(x, y) { cmds.push(['L', x, y]); return api; },
      Q(cx, cy, x, y) { cmds.push(['Q', cx, cy, x, y]); return api; },
      C(c1x, c1y, c2x, c2y, x, y) { cmds.push(['C', c1x, c1y, c2x, c2y, x, y]); return api; },
      // arco aproximado por cúbicas (suficiente para pintura)
      A(cx, cy, rx, ry, a0, a1, ccw) {
        const span = a1 - a0;
        const steps = Math.max(2, Math.ceil(Math.abs(span) / (Math.PI / 2)));
        let a = a0;
        for (let i = 0; i < steps; i++) {
          const b = a + span / steps;
          const k = (4 / 3) * Math.tan((b - a) / 4);
          const x0 = cx + Math.cos(a) * rx, y0 = cy + Math.sin(a) * ry;
          const x1 = cx + Math.cos(b) * rx, y1 = cy + Math.sin(b) * ry;
          const c1x = x0 - Math.sin(a) * rx * k, c1y = y0 + Math.cos(a) * ry * k;
          const c2x = x1 + Math.sin(b) * rx * k, c2y = y1 - Math.cos(b) * ry * k;
          cmds.push(['C', c1x, c1y, c2x, c2y, x1, y1]);
          a = b;
        }
        return api;
      },
      // polígono fechado a partir de lista [x,y,...]
      poly(pts) {
        api.M(pts[0], pts[1]);
        for (let i = 2; i < pts.length; i += 2) api.L(pts[i], pts[i + 1]);
        return api;
      },
      Z() { cmds.push(['Z']); return api; },
      el(cx, cy, rx, ry, rot) {
        if (rot) { /* rotação local por transformação na hora de pintar */ }
        return api.A(cx, cy, rx, ry, 0, Math.PI * 2);
      },
      build() {
        const p = new Path2D();
        for (const c of cmds) {
          switch (c[0]) {
            case 'M': p.moveTo(c[1], c[2]); break;
            case 'L': p.lineTo(c[1], c[2]); break;
            case 'Q': p.quadraticCurveTo(c[1], c[2], c[3], c[4]); break;
            case 'C': p.bezierCurveTo(c[1], c[2], c[3], c[4], c[5], c[6]); break;
            case 'Z': p.closePath(); break;
          }
        }
        return p;
      },
      // Achata em polilinhas (para contorno à mão / amostragem).
      flatten(step) {
        step = step || 5;
        const out = [];
        let cur = [], px = 0, py = 0, sx = 0, sy = 0;
        const push = (x, y) => { cur.push([x, y]); };
        for (const c of cmds) {
          if (c[0] === 'M') {
            if (cur.length > 1) out.push(cur);
            cur = []; px = c[1]; py = c[2]; sx = px; sy = py; push(px, py);
          } else if (c[0] === 'L') { px = c[1]; py = c[2]; push(px, py); }
          else if (c[0] === 'Q' || c[0] === 'C') {
            const isC = c[0] === 'C';
            const x0 = px, y0 = py;
            const c1x = c[1], c1y = c[2];
            const c2x = isC ? c[3] : c[1], c2y = isC ? c[4] : c[2];
            const x1 = isC ? c[5] : c[3], y1 = isC ? c[6] : c[4];
            const len = Math.hypot(x1 - x0, y1 - y0) + Math.hypot(c1x - x0, c1y - y0) + Math.hypot(c2x - x0, c2y - y0);
            const n = DS.clamp(Math.ceil(len / step), 4, 48);
            for (let i = 1; i <= n; i++) {
              const t = i / n, u = 1 - t;
              let x, y;
              if (isC) {
                x = u * u * u * x0 + 3 * u * u * t * c1x + 3 * u * t * t * c2x + t * t * t * x1;
                y = u * u * u * y0 + 3 * u * u * t * c1y + 3 * u * t * t * c2y + t * t * t * y1;
              } else {
                x = u * u * x0 + 2 * u * t * c1x + t * t * x1;
                y = u * u * y0 + 2 * u * t * c1y + t * t * y1;
              }
              push(x, y);
            }
            px = x1; py = y1;
          } else if (c[0] === 'Z') {
            if (cur.length > 1) { push(sx, sy); out.push(cur); cur = []; px = sx; py = sy; }
          }
        }
        if (cur.length > 1) out.push(cur);
        return out;
      },
      bbox() {
        let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
        for (const poly of api.flatten(8)) for (const [x, y] of poly) {
          if (x < x0) x0 = x; if (x > x1) x1 = x;
          if (y < y0) y0 = y; if (y > y1) y1 = y;
        }
        return [x0, y0, x1 - x0, y1 - y0];
      },
      clone() { const r = RPath(); r.cmds.push(...cmds.map(c => c.slice())); return r; },
      transformed(fn) { const r = RPath(); r.cmds.push(...cmds.map(c => c.slice())); r.cmds.forEach(c => {
        for (let i = 1; i < c.length; i += 2) { const p = fn(c[i], c[i + 1]); c[i] = p[0]; c[i + 1] = p[1]; }
      }); return r; },
    };
    return api;
  }
  DS.path = RPath;

  /* ------------------------------------------------------------- pincel: tinta
   * Contorno irregular: reamostra o path, desloca cada ponto pela normal com
   * ruído suave e desenha segmento a segmento modulando a espessura. */
  DS.ink = function (ctx, path, opt) {
    opt = opt || {};
    const color = opt.color || DS.P.ink;
    const w = opt.w == null ? 3 : opt.w;
    const seed = opt.seed || 7;
    const jit = opt.jitter == null ? 1.1 : opt.jitter;
    const alpha = opt.alpha == null ? 1 : opt.alpha;
    const dash = opt.dash || null;
    const step = opt.step || 4;
    const polys = path.flatten ? path.flatten(step) : [path];
    ctx.save();
    ctx.strokeStyle = color;
    ctx.globalAlpha = alpha;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (dash) ctx.setLineDash(dash);
    let k = 0;
    for (const poly of polys) {
      const pts = poly.slice();
      if (opt.close !== false && pts.length > 2) pts.push(pts[0]);
      for (let i = 0; i < pts.length - 1; i++) {
        const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
        if (opt.skip && opt.skip(x0, y0, x1, y1)) { k++; continue; }
        const dx = x1 - x0, dy = y1 - y0;
        const L = Math.hypot(dx, dy) || 1;
        const nx = -dy / L, ny = dx / L;
        const n0 = (DS.noise1(k * 0.35, seed) - 0.5) * 2 * jit;
        const n1 = (DS.noise1((k + 1) * 0.35, seed) - 0.5) * 2 * jit;
        const lw = w * (1 + (DS.noise1(k * 0.21 + 13, seed + 3) - 0.5) * 0.55);
        ctx.beginPath();
        ctx.moveTo(x0 + nx * n0, y0 + ny * n0);
        ctx.quadraticCurveTo(
          (x0 + x1) / 2 + nx * (n0 + n1) * 0.6, (y0 + y1) / 2 + ny * (n0 + n1) * 0.6,
          x1 + nx * n1, y1 + ny * n1);
        ctx.lineWidth = Math.max(0.35, lw);
        ctx.stroke();
        k++;
      }
    }
    ctx.restore();
  };

  /* ---------------------------------------------------------- pincel: material
   * Pintura em camadas: base, massas de sombra (desfocadas), massas internas,
   * hachura direcional, sujeira e, por fim, contorno irregular + luz de borda. */
  const KIND = {
    skin:    { hatch: 46, len: [4, 20], w: [0.5, 1.7], dir: -0.35, cols: ['#ffdcae', '#c9714a', '#ffc68d', '#a3553a'], alpha: [0.05, 0.26] },
    hair:    { hatch: 120, len: [8, 44], w: [0.6, 2.6], dir: -0.55, cols: ['#c07f52', '#20161a', '#8a543a', '#3b2620', '#e0a06a'], alpha: [0.06, 0.34] },
    cloth:   { hatch: 70, len: [4, 24], w: [0.6, 2.3], dir: 0.2, cols: ['#e33025', '#54060f', '#ff6a45', '#8d0f16'], alpha: [0.05, 0.3] },
    leather: { hatch: 78, len: [4, 22], w: [0.6, 2.4], dir: -0.3, cols: ['#9c6a48', '#241719', '#6d4632', '#c08a5c'], alpha: [0.05, 0.3] },
    steel:   { hatch: 90, len: [5, 26], w: [0.5, 2.2], dir: -0.9, cols: ['#cdb3ab', '#1b151a', '#6d5b58', '#e0703a'], alpha: [0.05, 0.32] },
    bone:    { hatch: 40, len: [3, 14], w: [0.5, 1.6], dir: 0.15, cols: ['#f6ecd6', '#8a6f57', '#c2a883'], alpha: [0.05, 0.22] },
    rope:    { hatch: 40, len: [3, 12], w: [0.5, 1.6], dir: 0.9, cols: ['#c9975c', '#5f3d22', '#8a6a3c'], alpha: [0.06, 0.3] },
    fur:     { hatch: 70, len: [4, 18], w: [0.5, 1.9], dir: 0.05, cols: ['#9c6a48', '#241719', '#c08a5c'], alpha: [0.06, 0.3] },
    grass:   { hatch: 90, len: [6, 30], w: [0.6, 2.4], dir: 0.35, cols: ['#a8c162', '#4d6b30', '#c8dc80'], alpha: [0.06, 0.3] },
    wood:    { hatch: 60, len: [5, 24], w: [0.6, 2.6], dir: 1.5, cols: ['#c9975c', '#2b1d0e', '#8a6a3c'], alpha: [0.06, 0.3] },
    stone:   { hatch: 34, len: [3, 16], w: [0.5, 1.8], dir: -0.6, cols: ['#cbc9bd', '#3a3936', '#6f6d66'], alpha: [0.06, 0.26] },
    leaf:    { hatch: 70, len: [6, 28], w: [0.6, 2.2], dir: 0.5, cols: ['#79c05a', '#14310f', '#3d8434'], alpha: [0.06, 0.3] },
    fire:    { hatch: 40, len: [4, 16], w: [0.6, 2.2], dir: -1.2, cols: ['#ffd75c', '#d21f16', '#ff8a1e'], alpha: [0.08, 0.3] },
    sand:    { hatch: 60, len: [3, 14], w: [0.5, 1.8], dir: 0.1, cols: ['#f4e6bf', '#a88f62', '#d8c088'], alpha: [0.05, 0.24] },
  };
  DS.KIND = KIND;

  DS.wash = function (ctx, path, opt) {
    opt = opt || {};
    const kindDef = KIND[opt.kind || 'skin'];
    const rnd = DS.rng(opt.seed || 1);
    const bb = opt.box || path.bbox();
    const [bx, by, bw, bh] = bb;
    const clip = path.build();
    const texture = opt.texture == null ? 1 : opt.texture;

    ctx.save();
    ctx.fillStyle = opt.base || DS.P.skin;
    ctx.fill(clip);

    ctx.save();
    ctx.clip(clip);
    // 1) massas de sombra grandes (desfocadas) para dar volume
    if (opt.shade !== false && opt.shadow) {
      ctx.save();
      if (!opt.noBlur) ctx.filter = 'blur(' + (opt.blur || 10) + 'px)';
      ctx.globalAlpha = opt.shadeAlpha == null ? 0.5 : opt.shadeAlpha;
      ctx.fillStyle = opt.shadow;
      ctx.translate(opt.shadeDx == null ? 0 : opt.shadeDx, opt.shadeDy == null ? -1 : opt.shadeDy);
      ctx.fill(clip);
      ctx.restore();
      // segunda massa mais escura, deslocada (núcleo da sombra)
      if (opt.deep) {
        ctx.save();
        if (!opt.noBlur) ctx.filter = 'blur(' + ((opt.blur || 10) * 0.8) + 'px)';
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = opt.deep;
        ctx.translate(opt.deepDx || 0, opt.deepDy || 0);
        ctx.beginPath();
        ctx.ellipse(bx + bw * (opt.deepCx || 0.5), by + bh * (opt.deepCy || 0.72),
          bw * (opt.deepRx || 0.42), bh * (opt.deepRy || 0.3), 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
    // 2) massas internas autorais (formas de sombra/luz desenhadas à mão)
    if (opt.masses) for (const m of opt.masses) {
      ctx.save();
      ctx.globalAlpha = m[2] == null ? 1 : m[2];
      ctx.fillStyle = m[1];
      if (m[3] && !opt.noBlur) ctx.filter = 'blur(' + m[3] + 'px)';
      ctx.fill((m[0].build ? m[0].build() : m[0]));
      ctx.restore();
    }
    // 3) hachura direcional (o "grão pictórico" que constrói forma)
    const hd = opt.hatch === false ? null : (opt.hatch || kindDef);
    if (hd) {
      const n = Math.round((hd.hatch || 60) * texture * (opt.hatchScale || 1));
      for (let i = 0; i < n; i++) {
        const px = bx + rnd() * bw, py = by + rnd() * bh;
        const L = DS.rrange(rnd, hd.len[0], hd.len[1]) * (opt.hatchLen || 1);
        const a = hd.dir + (rnd() - 0.5) * (opt.hatchSpread || 1.4);
        ctx.strokeStyle = DS.pick(rnd, hd.cols);
        ctx.globalAlpha = DS.rrange(rnd, hd.alpha[0], hd.alpha[1]) * (opt.hatchAlpha || 1);
        ctx.lineWidth = DS.rrange(rnd, hd.w[0], hd.w[1]);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.quadraticCurveTo(
          px + Math.cos(a) * L * 0.45 + (rnd() - 0.5) * 3,
          py + Math.sin(a) * L * 0.45 + (rnd() - 0.5) * 3,
          px + Math.cos(a) * L, py + Math.sin(a) * L);
        ctx.stroke();
      }
      // riscos longos ocasionais, tipo pincel seco
      for (let i = 0; i < Math.round(7 * texture); i++) {
        const px = bx + rnd() * bw, py = by + rnd() * bh;
        const L = DS.rrange(rnd, hd.len[1], hd.len[1] * 3.2);
        const a = hd.dir + (rnd() - 0.5) * 0.6;
        ctx.strokeStyle = rnd() > 0.5 ? hd.cols[0] : hd.cols[1];
        ctx.globalAlpha = DS.rrange(rnd, 0.05, 0.16);
        ctx.lineWidth = DS.rrange(rnd, hd.w[1], hd.w[1] * 2.6);
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.quadraticCurveTo(px + Math.cos(a) * L * 0.5, py + Math.sin(a) * L * 0.5 + 3,
          px + Math.cos(a) * L, py + Math.sin(a) * L);
        ctx.stroke();
      }
    }
    // 4) manchas de sujeira/sangue opcionais
    if (opt.dirt) for (let i = 0; i < opt.dirt; i++) {
      const px = bx + rnd() * bw, py = by + rnd() * bh;
      const r = 4 + rnd() * (Math.min(bw, bh) * 0.22);
      ctx.globalAlpha = DS.rrange(rnd, 0.04, 0.16);
      ctx.fillStyle = opt.dirtColor || '#241719';
      ctx.beginPath();
      ctx.ellipse(px, py, r, r * (0.35 + rnd() * 0.5), rnd() * 3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore(); // fim do clip

    // 5) contorno irregular + luz de borda
    if (opt.ink !== false) {
      DS.ink(ctx, path, { color: opt.inkColor || DS.P.ink, w: opt.inkW == null ? 3.4 : opt.inkW, seed: (opt.seed || 1) * 3 + 5, jitter: opt.inkJitter == null ? 1.2 : opt.inkJitter, alpha: opt.inkAlpha == null ? 1 : opt.inkAlpha });
    }
    if (opt.light) {
      ctx.save();
      ctx.globalAlpha = opt.lightAlpha == null ? 0.5 : opt.lightAlpha;
      ctx.strokeStyle = opt.light;
      ctx.lineWidth = opt.lightW == null ? 2.4 : opt.lightW;
      ctx.lineCap = 'round';
      const polys = path.flatten(6);
      for (const poly of polys) {
        if (poly.length < 3) continue;
        const a0 = opt.lightFrom == null ? 0.06 : opt.lightFrom;
        const a1 = opt.lightTo == null ? 0.5 : opt.lightTo;
        const i0 = Math.floor(poly.length * a0), i1 = Math.floor(poly.length * a1);
        ctx.beginPath();
        ctx.moveTo(poly[i0][0], poly[i0][1]);

    const p = DS.path();
    p.M(baseL[0], baseL[1]);

/* ============================================================================
 * 04-weapon.js — ADAGA DE SANGUE E FOGO DO CAOS (par de lâminas assassinas)
 * Geometria 100% Canvas 2D em coordenadas locais da arma:
 *   origem (0,0) = ponto de empunhadura (GRIP) compartilhado com a mão
 *   +x = do grip para fora do corpo (em direção à guarda/lâmina)
 *   -y = para cima (a lâmina cresce para cima/fora)
 * Regras do documento da arma: NÃO é machado; é uma adaga grande, crescente,
 * ensanguentada, incandescente, acorrentada pelo pomo ao antebraço.
 * Leitura da folha oficial hero-part-weapons.png:
 *   - borda EXTERNA (convexa) é o fio: brasa laranja/amarela e fissuras de lava
 *   - massa INTERNA é cinza-carvão (cinza frio, fuligem, lascas)
 *   - borda INTERNA côncava com 3 farpas/dentes voltados para fora
 *   - ponta em gancho + chifre inferior curvo
 * ========================================================================== */
(function (DS) {
  'use strict';

  const W = DS.WEAPON = {
    // ponto de empunhadura fixo (regra: mão e arma compartilham o mesmo ponto)
    GRIP: { x: 0, y: 0 },
    POMMEL: { x: -70, y: 8 },        // anel do pomo (entrada da corrente)
    GUARD: { x: 58, y: -4 },         // guarda metálica
    BLADE_ROOT: { x: 70, y: -10 },
    CHAIN_ANCHOR: { x: -78, y: 16 }, // presilha do pomo onde a corrente entra
    HANDLE_A: { x: -60, y: 0 },      // início do cabo (lado do pomo)
    HANDLE_B: { x: 62, y: 0 },       // fim do cabo (lado da guarda)
    /* Escala da lâmina em torno de BLADE_PIVOT. 0.98 foi escolhida para que a
     * ponta DESENHADA caia exatamente sobre SK.BLADE_TIP (usada na hitbox):
     * pivot + (tip - pivot) * s  =  (70 + 202*0.98, -10 - 218*0.98) = (268, -224)
     * -> casar com o desenho é regra: "o que acerta na tela é o que acerta no jogo". */
    BLADE_SCALE: 0.98,               // lâmina grande, como na folha oficial
    BLADE_PIVOT: { x: 70, y: -10 },
  };

  /* ------------------------------------------------------------------ paths */
  function pathFrom(cmds, s) {
    const p = DS.path();
    for (const c of cmds) {
      if (c[0] === 'M') p.M(c[1] * s, c[2]);
      else if (c[0] === 'L') p.L(c[1] * s, c[2]);
      else if (c[0] === 'Q') p.Q(c[1] * s, c[2], c[3] * s, c[4]);
      else if (c[0] === 'C') p.C(c[1] * s, c[2], c[3] * s, c[4], c[5] * s, c[6]);
      else if (c[0] === 'Z') p.Z();
    }
    return p;
  }

  /* Silhueta da lâmina: crescente largo com ponta em gancho, três farpas na
   * borda interna e chifre inferior curvo (leitura da folha oficial). */
  const BLADE_CMDS = [
    ['M', 92, -58],                                     // raiz superior (topo do cabo)
    ['C', 46, -140, 120, -238, 250, -262],              // borda EXTERNA convexa (o fio)
    ['L', 328, -290],                                   // ponta longa e fina
    ['C', 300, -266, 282, -252, 262, -238],             // volta do gancho da ponta
    // serrilha: dentes curtos e afiados na borda interna (leitura da folha oficial)
    ['L', 292, -224], ['L', 266, -216],
    ['L', 286, -196], ['L', 252, -186],
    ['L', 274, -166], ['L', 240, -154],
    ['L', 264, -132], ['L', 230, -118],
    ['L', 256, -94], ['L', 222, -78],
    // borda interna lisa descendo até o entalhe
    ['C', 230, -48, 236, -22, 238, 4],
    // chifre inferior longo, curvo (cúspide de crescente)
    ['C', 252, 36, 254, 70, 238, 98],
    ['L', 224, 118],                                    // ponta do chifre
    ['C', 206, 96, 196, 72, 190, 46],                   // lado de dentro do chifre
    // "mordida": entalhe profundo entre o chifre e a raiz
    ['C', 176, 40, 166, 26, 162, 10],
    ['C', 150, -4, 128, -8, 108, 0],                    // borda inferior até a raiz
    ['Z'],
  ];
  const OUTER_CMDS = [
    ['M', 92, -58],
    ['C', 46, -140, 120, -238, 250, -262],
    ['L', 328, -290],
  ];
  const INNER_CMDS = [
    ['M', 262, -238],
    ['L', 292, -224], ['L', 266, -216],
    ['L', 286, -196], ['L', 252, -186],
    ['L', 274, -166], ['L', 240, -154],
    ['L', 264, -132], ['L', 230, -118],
    ['L', 256, -94], ['L', 222, -78],
    ['C', 230, -48, 236, -22, 238, 4],
    ['C', 252, 36, 254, 70, 238, 98], ['L', 224, 118],
  ];

  DS.bladePath = function (side, variant) { return pathFrom(BLADE_CMDS, side < 0 ? -1 : 1); };
  DS.bladeOuterEdge = function (side) { return pathFrom(OUTER_CMDS, side < 0 ? -1 : 1); };
  DS.bladeInnerEdge = function (side) { return pathFrom(INNER_CMDS, side < 0 ? -1 : 1); };

  /* Utilitários de geometria para prender a pintura à silhueta. */
  DS.pointInPoly = function (poly, x, y) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
      if (((yi > y) !== (yj > y)) && (x < ((xj - xi) * (y - yi)) / (yj - yi + 1e-9) + xi)) inside = !inside;
    }
    return inside;
  };
  DS.flattenPoly = function (path) {
    const polys = path.flatten(5);
    let best = polys[0] || [];
    for (const p of polys) if (p.length > best.length) best = p;
    return best;
  };
  // ponto aleatório DENTRO de um path fechado (crosta, sangue, brasa)
  DS.pointInPath = function (path, poly, rnd) {
    const bb = path.bbox();
    for (let i = 0; i < 48; i++) {
      const x = bb[0] + rnd() * bb[2], y = bb[1] + rnd() * bb[3];
      if (DS.pointInPoly(poly, x, y)) return [x, y];
    }
    return [bb[0] + bb[2] / 2, bb[1] + bb[3] / 2];
  };

  /* --------------------------------------------------------------- lâmina */
  // amostra uma borda e devolve pontos + normal que aponta para dentro
  function edgeSamples(path, insidePoly, step) {
    const pts = path.flatten(step || 4)[0];
    const out = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const L = Math.hypot(tx, ty) || 1; tx /= L; ty /= L;
      let nx = -ty, ny = tx;
      const t = i / (pts.length - 1);
      if (!DS.pointInPoly(insidePoly, pts[i][0] + nx * 6, pts[i][1] + ny * 6)) { nx = -nx; ny = -ny; }
      out.push({ x: pts[i][0], y: pts[i][1], nx, ny, t });
    }
    return out;
  }

  function buildBand(samples, widthFn) {
    const p = DS.path();
    const off = samples.map((s, i) => {
      const w = widthFn(s.t, i);
      return [s.x + s.nx * w, s.y + s.ny * w];
    });
    p.M(off[0][0], off[0][1]);
    for (let i = 1; i < off.length; i++) p.L(off[i][0], off[i][1]);
    for (let i = samples.length - 1; i >= 0; i--) p.L(samples[i].x, samples[i].y);
    p.Z();
    return p;
  }

  function paintBlade(ctx, side, seed) {
    const s = side < 0 ? -1 : 1;
    const rnd = DS.rng(seed);
    const path = DS.bladePath(side);
    const poly = DS.flattenPoly(path);
    const clip = path.build();
    const outer = DS.bladeOuterEdge(side);
    const inner = DS.bladeInnerEdge(side);
    const bb = path.bbox();

    /* 1) massa de aço-carvão (fuligem) ------------------------------------ */
    ctx.save();
    const gA = ctx.createLinearGradient(120 * s, -270, 80 * s, 100);
    gA.addColorStop(0, '#7c6c6c');
    gA.addColorStop(0.34, '#544749');
    gA.addColorStop(0.7, '#3a3033');
    gA.addColorStop(1, '#2a2225');
    ctx.fillStyle = gA;
    ctx.fill(clip);
    ctx.restore();

    ctx.save();
    ctx.clip(clip);

    /* 2) brasa seguindo a BORDA EXTERNA (o fio é quente) ------------------ */
    const samples = edgeSamples(outer, poly, 3.5);
    const widthFn = (t) => {
      const k = DS.clamp((t - 0.04) / 0.92, 0, 1);
      const base = 10 + 86 * Math.pow(Math.sin(Math.PI * k), 0.75);
      return base * (0.72 + 0.55 * DS.noise1(t * 9 + 3, seed));
    };
    const band = buildBand(samples, widthFn);
    ctx.save();
    ctx.fillStyle = '#5e0a0d';
    ctx.fill(band.build());
    // rampa de lava: do branco-amarelo no fio até vermelho-escuro para dentro
    const RAMP = [
      [0.03, '#fff3c4', 0.95, 3.0, 0],
      [0.13, '#ffd75c', 0.92, 7, 0],
      [0.26, '#ff9a22', 0.88, 12, 0],
      [0.42, '#f0521a', 0.78, 17, 2],
      [0.62, '#b8141b', 0.68, 21, 3],
      [0.84, '#680a11', 0.6, 24, 4],
      [1.02, '#3a060c', 0.5, 26, 5],
    ];
    ctx.clip(band.build());
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    for (const [d, col, al, lw, bl] of RAMP) {
      const q = DS.path();
      for (let i = 0; i < samples.length; i++) {
        const sm = samples[i];
        const w = widthFn(sm.t, i) * d;
        const x = sm.x + sm.nx * w, y = sm.y + sm.ny * w;
        if (i === 0) q.M(x, y); else q.L(x, y);
      }
      ctx.save();
      if (bl) ctx.filter = 'blur(' + bl + 'px)';
      ctx.globalAlpha = al;
      ctx.strokeStyle = col;
      ctx.lineWidth = lw;
      ctx.stroke(q.build());
      ctx.restore();
    }
    // núcleo incandescente em pontos específicos do fio
    for (let i = 0; i < 6; i++) {
      const sm = samples[Math.floor((0.08 + rnd() * 0.78) * samples.length)];
      DS.glow(ctx, sm.x + sm.nx * 4, sm.y + sm.ny * 4, 20 + rnd() * 26,
        'rgba(255,232,150,0.55)', 'rgba(255,110,20,0.22)', 0.9);
    }
    ctx.restore(); // fim clip da banda

    /* 3) veias de lava (fissuras que entram na massa de carvão) ----------- */
    for (let i = 0; i < 15; i++) {
      const sm = samples[Math.floor((0.05 + rnd() * 0.85) * samples.length)];
      let w0 = widthFn(sm.t) * (0.5 + rnd() * 0.4);
      let x = sm.x + sm.nx * w0, y = sm.y + sm.ny * w0;
      let ang = Math.atan2(sm.ny, sm.nx) + (rnd() - 0.5) * 0.8;
      const segs = 2 + Math.floor(rnd() * 3);
      const pts = [[x, y]];
      for (let k = 0; k < segs; k++) {
        const L = 12 + rnd() * 34;
        ang += (rnd() - 0.5) * 0.7;
        x += Math.cos(ang) * L; y += Math.sin(ang) * L;
        pts.push([x, y]);
      }
      for (const [col, off, lw, al] of [['#1a0c0c', 2.4, 5.4, 0.7], ['#ff8a1e', 0, 2.6, 0.85], ['#ffe08a', 0, 1.0, 0.75]]) {
        ctx.save();
        ctx.globalAlpha = al * (0.6 + rnd() * 0.4);
        ctx.strokeStyle = col;
        ctx.lineWidth = lw;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1] + off);
        for (let k = 1; k < pts.length; k++) {
          const a = pts[k - 1], b = pts[k];
          ctx.quadraticCurveTo(a[0], a[1] + off, b[0], b[1] + off);
        }
        ctx.stroke();
        ctx.restore();
      }
    }

    /* 4) crosta de carvão sobre a brasa (lascas irregulares) -------------- */
    for (let i = 0; i < 30; i++) {
      const sm = samples[Math.floor((0.04 + rnd() * 0.92) * samples.length)];
      const w = widthFn(sm.t) * (0.35 + rnd() * 0.85);
      const x = sm.x + sm.nx * w, y = sm.y + sm.ny * w;
      const r = 6 + rnd() * 20;
      ctx.save();
      ctx.globalAlpha = 0.22 + rnd() * 0.5;
      ctx.fillStyle = rnd() < 0.6 ? '#3a2f31' : '#54494b';
      if (rnd() < 0.4) ctx.filter = 'blur(2.5px)';
      ctx.beginPath();
      ctx.ellipse(x, y, r, r * (0.3 + rnd() * 0.5), rnd() * 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    /* 5) fuligem + lascas metálicas no resto da lâmina -------------------- */
    // grandes reflexos de aço (massas claras desfocadas) para não virar silhueta preta
    for (let i = 0; i < 5; i++) {
      const [x, y] = DS.pointInPath(path, poly, rnd);
      ctx.save();
      ctx.globalAlpha = 0.10 + rnd() * 0.16;
      ctx.filter = 'blur(16px)';
      ctx.fillStyle = i % 2 ? '#b0a09a' : '#8d7e7c';
      ctx.beginPath();
      ctx.ellipse(x, y, 24 + rnd() * 46, 12 + rnd() * 26, -0.7 + rnd() * 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    for (let i = 0; i < 58; i++) {
      const [x, y] = DS.pointInPath(path, poly, rnd);
      ctx.save();
      ctx.globalAlpha = 0.12 + rnd() * 0.34;
      ctx.fillStyle = rnd() < 0.5 ? '#191316' : '#6e5f60';
      ctx.beginPath();
      ctx.ellipse(x, y, 3 + rnd() * 13, 2 + rnd() * 8, rnd() * 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    for (let i = 0; i < 34; i++) {
      const [x, y] = DS.pointInPath(path, poly, rnd);
      const L = 7 + rnd() * 26;
      const a = -1.15 + rnd() * 0.55;
      ctx.save();
      ctx.globalAlpha = 0.10 + rnd() * 0.26;
      ctx.strokeStyle = rnd() < 0.5 ? '#cdb3ab' : '#8a6a60';
      ctx.lineWidth = 0.7 + rnd() * 1.7;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + Math.cos(a) * L * s, y + Math.sin(a) * L);
      ctx.stroke();
      ctx.restore();
    }
    // bisel claro rente à borda interna serrilhada (metal afiado)
    ctx.save();
    ctx.globalAlpha = 0.3;
    ctx.filter = 'blur(4px)';
    ctx.strokeStyle = '#a89690';
    ctx.lineWidth = 9;
    ctx.lineJoin = 'round';
    ctx.stroke(inner.build());
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = '#cbb6ac';
    ctx.lineWidth = 1.5;
    ctx.stroke(inner.build());
    ctx.restore();

    /* 6) sangue: escorridos e respingos presos à lâmina ------------------- */
    for (let i = 0; i < 10; i++) {
      const [x0, y0] = DS.pointInPath(path, poly, rnd);
      const L = 20 + rnd() * 66;
      ctx.save();
      ctx.globalAlpha = 0.34 + rnd() * 0.4;
      ctx.strokeStyle = i % 4 === 0 ? '#c8231c' : '#6b0a0d';
      ctx.lineWidth = 2.0 + rnd() * 4.4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.quadraticCurveTo(x0 + 5, y0 + L * 0.5, x0 - 3, y0 + L);
      ctx.stroke();
      // realce especular do escorrido
      ctx.globalAlpha = 0.22;
      ctx.strokeStyle = '#ff6a58';
      ctx.lineWidth = 0.9;
      ctx.beginPath();
      ctx.moveTo(x0 - 1.4, y0 + 3);
      ctx.quadraticCurveTo(x0 + 3, y0 + L * 0.5, x0 - 4.6, y0 + L - 3);
      ctx.stroke();
      ctx.restore();
    }
    for (let i = 0; i < 34; i++) {
      const [x0, y0] = DS.pointInPath(path, poly, rnd);
      ctx.save();
      ctx.globalAlpha = 0.26 + rnd() * 0.44;
      ctx.fillStyle = i % 3 ? '#8d0f10' : '#c8231c';
      ctx.beginPath();
      ctx.ellipse(x0, y0, 1.4 + rnd() * 4.2, 1.0 + rnd() * 3, rnd() * 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    /* 7) sombra interna na concavidade (dá a leitura de crescente) -------- */
    ctx.save();
    ctx.globalAlpha = 0.34;
    ctx.filter = 'blur(10px)';
    ctx.strokeStyle = '#0d090c';
    ctx.lineWidth = 20;
    ctx.lineCap = 'round';
    ctx.stroke(inner.build());
    ctx.restore();
    ctx.restore(); // fim clip principal

    /* 8) fio cortante: luz dura rente à borda externa --------------------- */
    ctx.save();
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = '#e8d3c6';
    ctx.lineWidth = 2.6;
    ctx.stroke(outer.build());
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = '#fff0c0';
    ctx.lineWidth = 1.0;
    ctx.stroke(outer.build());
    // fio serrilhado: luz fria curta para os dentes lerem contra a sombra
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = '#d8c3b8';
    ctx.lineWidth = 1.5;
    ctx.stroke(inner.build());
    ctx.globalAlpha = 0.28;
    ctx.strokeStyle = '#ffb060';
    ctx.lineWidth = 3.2;
    ctx.stroke(inner.build());
    DS.glow(ctx, 328 * s, -288, 30, 'rgba(255,220,150,0.5)', 'rgba(255,90,30,0.2)', 0.9);
    DS.glow(ctx, 226 * s, 116, 26, 'rgba(255,180,100,0.4)', 'rgba(200,60,20,0.16)', 0.9);
    ctx.restore();

    /* 8b) halo emissivo externo: a lâmina lê como fogo mesmo em escala pequena */
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineJoin = 'round';
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = '#ff6a14';
    ctx.lineWidth = 30;
    ctx.stroke(outer.build());
    ctx.globalAlpha = 0.42;
    ctx.strokeStyle = '#ffc861';
    ctx.lineWidth = 11;
    ctx.stroke(outer.build());
    ctx.restore();

    /* 9) contorno irregular final (tinta artesanal) ----------------------- */
    DS.ink(ctx, path, { color: '#170e13', w: 5.0, seed: seed + 21, jitter: 1.8 });
    DS.ink(ctx, path, { color: 'rgba(178,140,124,0.22)', w: 1.3, seed: seed + 33, jitter: 2.2, alpha: 0.4 });
    // marcas de batalha no dorso
    for (let i = 0; i < 5; i++) {
      const x = bb[0] + bb[2] * (0.2 + rnd() * 0.55), y = bb[1] + 8 + rnd() * 22;
      ctx.save();
      ctx.globalAlpha = 0.45;
      ctx.strokeStyle = '#0f0a0e';
      ctx.lineWidth = 2.0;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + 12 * s, y + 9 + rnd() * 6);
      ctx.stroke();
      ctx.restore();
    }
  }

  /* ------------------------------------------------------------------ cabo */
  function handlePath(side) {
    const s = side < 0 ? -1 : 1;
    const p = DS.path();
    p.M(-58 * s, -6);
    p.C(-66 * s, -22, -46 * s, -32, -18 * s, -30);
    p.C(18 * s, -28, 50 * s, -24, 62 * s, -14);
    p.C(70 * s, -8, 70 * s, 8, 62 * s, 14);
    p.C(50 * s, 24, 18 * s, 28, -18 * s, 26);
    p.C(-46 * s, 24, -66 * s, 18, -58 * s, -6);
    p.Z();
    return p;
  }
  function collarPath(side) {
    const s = side < 0 ? -1 : 1;
    const p = DS.path();
    p.M(54 * s, -26);
    p.C(80 * s, -28, 94 * s, -14, 94 * s, 2);
    p.C(94 * s, 20, 82 * s, 30, 56 * s, 28);
    p.C(68 * s, 14, 70 * s, -12, 54 * s, -26);
    p.Z();
    return p;
  }
  function pommelPath(side) {
    const s = side < 0 ? -1 : 1;
    const p = DS.path();
    p.M(-46 * s, -14);
    p.C(-74 * s, -22, -92 * s, -6, -90 * s, 14);
    p.C(-88 * s, 34, -68 * s, 44, -48 * s, 36);
    p.C(-32 * s, 28, -36 * s, 4, -46 * s, -14);
    p.Z();
    return p;
  }

  function paintHandle(ctx, side, seed) {
    const s = side < 0 ? -1 : 1;
    const hp = handlePath(side);
    DS.wash(ctx, hp, {
      kind: 'leather', base: '#4a3226', shadow: '#1b1215', seed: seed + 90,
      box: [-70, -36, 150, 72], inkW: 4.0, shadeAlpha: 0.5, blur: 8, deep: '#160e12',
      hatch: { hatch: 80, len: [3, 15], w: [0.5, 1.9], dir: -0.35, cols: ['#9c6a48', '#241719', '#c08a5c'], alpha: [0.06, 0.3] },
    });
    // tiras de couro enroladas em diagonal + costura
    ctx.save();
    ctx.clip(hp.build());
    for (let i = 0; i < 7; i++) {
      const x = (-44 + i * 16) * s;
      ctx.globalAlpha = 0.92;
      ctx.strokeStyle = i % 2 ? '#2a1a19' : '#6b4630';
      ctx.lineWidth = 6.5;
      ctx.beginPath();
      ctx.moveTo(x - 8 * s, -32);
      ctx.quadraticCurveTo(x + 6 * s, 0, x - 6 * s, 32);
      ctx.stroke();
      ctx.globalAlpha = 0.4;
      ctx.strokeStyle = '#c08a5c';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(x - 11 * s, -28);
      ctx.quadraticCurveTo(x + 3 * s, 0, x - 9 * s, 28);
      ctx.stroke();
    }
    ctx.restore();
    DS.ink(ctx, hp, { color: '#180f12', w: 4.0, seed: seed + 95, jitter: 1.2 });

    // guarda metálica com rebites
    const cp = collarPath(side);
    DS.wash(ctx, cp, {
      kind: 'steel', base: '#4c3a35', shadow: '#171116', deep: '#100b10', seed: seed + 100,
      box: [50, -34, 50, 70], inkW: 3.4, shadeAlpha: 0.5, blur: 7,
      hatch: { hatch: 34, len: [2, 10], w: [0.5, 1.6], dir: -0.9, cols: ['#cdb3ab', '#1b151a', '#e0703a'], alpha: [0.06, 0.3] },
    });
    for (let i = 0; i < 3; i++) {
      const x = (62 + i * 8) * s;
      ctx.save();
      ctx.fillStyle = '#a98a72'; ctx.globalAlpha = 0.7;
      ctx.beginPath(); ctx.ellipse(x, -12 + i * 12, 2.3, 2.3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2a1d1c'; ctx.globalAlpha = 0.8;
      ctx.beginPath(); ctx.ellipse(x + 0.8 * s, -11 + i * 12, 1.0, 1.0, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    // anel do pomo: toro com furo por onde a corrente entra
    const pp = pommelPath(side);
    DS.wash(ctx, pp, {
      kind: 'steel', base: '#493833', shadow: '#150f14', deep: '#0e0a0e', seed: seed + 110,
      box: [-96, -28, 68, 84], inkW: 3.8, shadeAlpha: 0.55, blur: 6,
      hatch: { hatch: 30, len: [2, 10], w: [0.5, 1.5], dir: -0.9, cols: ['#cdb3ab', '#1b151a', '#e0703a'], alpha: [0.06, 0.28] },
    });
    ctx.save();
    ctx.globalAlpha = 0.95;
    ctx.fillStyle = '#120d11';
    ctx.beginPath();
    ctx.ellipse(-68 * s, 9, 11, 13, 0.16 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    DS.drawChain(ctx, DS.chainPath(-66 * s, 18, -58 * s, 46, 6), { pitch: 26, scale: 0.92, lw: 3.4 });
  }

  /* --------------------------------------------------- lâmina + cabo completo */
  DS.drawWeapon = function (ctx, side, opts) {
    opts = opts || {};
    const seed = 1300 + (side < 0 ? 7 : 0) + (opts.variant || 0);
    ctx.save();
    if (opts.scale && opts.scale !== 1) ctx.scale(opts.scale, opts.scale);
    // lâmina reduzida em torno da raiz (proporção da referência: ~2,2x o cabo)
    ctx.save();
    ctx.translate(W.BLADE_PIVOT.x, W.BLADE_PIVOT.y);
    ctx.scale(W.BLADE_SCALE, W.BLADE_SCALE);
    ctx.translate(-W.BLADE_PIVOT.x, -W.BLADE_PIVOT.y);
    paintBlade(ctx, side, seed);
    ctx.restore();
    paintHandle(ctx, side, seed);
    ctx.restore();
  };

  /* ------------------------------------------------------------- mão no cabo
   * A mão é desenhada NO MESMO espaço local da arma: o cabo fica entre o dorso
   * da mão (camada 'back') e os dedos/polegar (camada 'front'), produzindo a
   * oclusão correta exigida no documento da arma. Punho compacto (chibi). */
  DS.drawHandGrip = function (ctx, side, layer, opts) {
    opts = opts || {};
    const seed = 1400 + (side < 0 ? 11 : 0);
    ctx.save();
    ctx.scale(side < 0 ? -1 : 1, 1); // autoria no lado canônico

    if (layer === 'back') {
      // antebraço curto + dorso da mão (a corrente e a manga vêm do arm painter)
      const fore = DS.path();
      fore.M(-100, -22);
      fore.C(-84, -30, -66, -28, -52, -20);
      fore.C(-44, -12, -42, -2, -46, 10);
      fore.C(-58, 24, -82, 28, -100, 20);
      fore.C(-108, 8, -108, -12, -100, -22);
      fore.Z();
      DS.wash(ctx, fore, {
        kind: 'skin', base: '#dd8b5b', shadow: '#a3553a', deep: '#8b4832', seed: seed + 7,
        box: [-110, -34, 68, 68], inkW: 3.4, shadeAlpha: 0.5, blur: 8,
      });
      // dorso da mão (massa atrás do cabo, em sombra para não competir com os dedos)
      const back = DS.path();
      back.M(-48, -28);
      back.C(-24, -36, 4, -34, 20, -24);
      back.C(30, -16, 28, -2, 16, 6);
      back.C(-4, 18, -32, 18, -46, 8);
      back.C(-56, -2, -56, -18, -48, -28);
      back.Z();
      DS.wash(ctx, back, {
        kind: 'skin', base: '#c87a4e', shadow: '#9c5238', deep: '#87422e', seed: seed + 3,
        box: [-62, -42, 100, 76], inkW: 3.2, shadeAlpha: 0.45, blur: 7,
        masses: [
          [DS.pc('M -42 -26 C -22 -34 2 -32 16 -24 C 6 -16 -18 -14 -38 -16 Z'), '#e79a66', 0.3, 5],
        ],
      });
      // nós dos dedos (calos) na borda superior do dorso
      for (let i = 0; i < 4; i++) {
        const x = -42 + i * 18;
        ctx.save();
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = '#e59463';
        ctx.beginPath(); ctx.ellipse(x, -28, 8.4, 6.2, -0.06, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 0.45;
        ctx.strokeStyle = '#8f4a33'; ctx.lineWidth = 1.1; ctx.stroke();
        ctx.globalAlpha = 0.5;
        ctx.fillStyle = '#ffd2a0';
        ctx.beginPath(); ctx.ellipse(x - 1.4, -31, 4.2, 2.1, -0.1, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      DS.ink(ctx, back, { color: '#5d3227', w: 2.0, seed: seed + 5, jitter: 0.9, alpha: 0.65 });
      ctx.restore();
      return;
    }

    /* camada frontal: 4 dedos enrolados + polegar cruzando por cima ------- */
    const drawFinger = (x0, w, yTop, yBot, lit) => {
      const p = DS.path();
      p.M(x0 - 1, yTop - 8);
      p.C(x0 + w * 0.72, yTop - 12, x0 + w * 1.05, yTop + 8, x0 + w * 0.95, yBot - 6);
      p.C(x0 + w * 0.9, yBot + 2, x0 + w * 0.35, yBot + 6, x0 + 3, yBot + 5);
      p.C(x0 - 5, yBot + 3, x0 - 7, yTop + 8, x0 - 1, yTop - 8);
      p.Z();
      DS.wash(ctx, p, {
        kind: 'skin', base: lit ? '#f2ab72' : '#e59463', shadow: '#a3553a', deep: '#8f4a33',
        seed: seed + Math.round(x0 * 5 + 40), box: [x0 - 12, yTop - 16, w + 26, (yBot - yTop) + 32], inkW: 2.9,
        shadeAlpha: 0.44, blur: 4,
        masses: [
          [DS.path().M(x0 + w * 0.2, yTop - 2).Q(x0 + w * 0.85, yTop + 6, x0 + w * 0.7, yBot - 12)
            .Q(x0 + w * 0.3, yBot - 8, x0 + w * 0.2, yTop - 2).Z(), '#ffd2a0', 0.4, 4],
          [DS.path().M(x0 - 1, yBot - 16).Q(x0 + w * 0.5, yBot - 8, x0 + w * 0.85, yBot - 14)
            .Q(x0 + w * 0.5, yBot + 3, x0 - 1, yBot + 2).Z(), '#8f4a33', 0.38, 3],
        ],
      });
      // ruga da articulação média
      DS.strokes(ctx, [`M ${x0 + 1} ${yTop + 18} Q ${x0 + w * 0.6} ${yTop + 24} ${x0 + w * 0.88} ${yTop + 16}`], '#a3553a', 1.3, 0.65);
      // unha / ponta do dedo sumindo atrás do cabo
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = '#ffe0b4';
      ctx.beginPath();
      ctx.ellipse(x0 + w * 0.72, yBot - 3, 3.2, 2.2, 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    };
    drawFinger(-44, 19, -22, 20, false);
    drawFinger(-24, 20, -24, 22, true);
    drawFinger(-3, 20, -24, 22, true);
    drawFinger(17, 19, -22, 20, false);

    // polegar cruzando por cima do cabo (fecha a pegada)
    const th = DS.path();
    th.M(-40, -24);
    th.C(-26, -38, 2, -42, 22, -34);
    th.C(40, -27, 46, -12, 34, -5);
    th.C(16, 5, -16, 2, -34, -4);
    th.C(-46, -8, -47, -17, -40, -24);
    th.Z();
    DS.wash(ctx, th, {
      kind: 'skin', base: '#f4b078', shadow: '#b46340', deep: '#934e37', seed: seed + 41,
      box: [-50, -46, 100, 56], inkW: 3.2, shadeAlpha: 0.44, blur: 5,
      masses: [
        [DS.path().M(-24, -30).C(-8, -42, 14, -40, 26, -30).C(10, -22, -10, -22, -24, -30).Z(), '#ffd2a0', 0.45, 4],
        [DS.path().M(-28, -12).C(-10, -4, 12, -6, 26, -14).C(8, -1, -12, -1, -28, -6).Z(), '#a3553a', 0.45, 4],
      ],
    });
    DS.strokes(ctx, ['M -18 -32 Q 2 -38 18 -32', 'M -6 -36 Q 6 -40 14 -35'], '#a3553a', 1.3, 0.6);
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#ffdcae';
    ctx.beginPath(); ctx.ellipse(26, -26, 5.0, 3.6, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.restore();
  };

  /* --------------------------------------------------------- corrente de elos
   * Elos individuais, volumosos, de ferro escuro; nunca linha simples.
   * Leitura oficial: elos redondos/ovais gordos com realce de ferrugem. */
  DS.chainPath = function (x0, y0, x1, y1, sag) {
    const mx = (x0 + x1) / 2, my = (y0 + y1) / 2 + (sag || 0);
    return {
      x0, y0, x1, y1, mx, my,
      at(t) {
        const u = 1 - t;
        return [u * u * x0 + 2 * u * t * mx + t * t * x1, u * u * y0 + 2 * u * t * my + t * t * y1];
      },
    };
  };

  /* Um elo pré-renderizado (sprite) — o laço desenha dezenas de elos por quadro;
   * criar 1 gradiente + 8 paths por elo custava ~1,2 ms por corrente. */
  const linkSprites = {};
  function linkSprite(flat, sc, lw) {
    const key = (flat ? 'f' : 'r') + '|' + sc.toFixed(2) + '|' + lw.toFixed(2);
    if (linkSprites[key]) return linkSprites[key];
    const rx = (flat ? 15.5 : 9.2) * sc, ry = (flat ? 11.4 : 12.6) * sc;
    const pad = 6 * sc + lw * sc;
    const W = (rx * 1.16 + pad) * 2, H = (ry * 1.16 + pad) * 2;
    const ss = 2;
    const c = DS.canvas(W * ss, H * ss);
    const ctx = c.getContext('2d');
    ctx.save();
    ctx.scale(ss, ss);
    ctx.translate(W / 2, H / 2);
    ctx.lineCap = 'round';
    // sombra projetada
    ctx.save();
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = '#120c0d';
    ctx.beginPath(); ctx.ellipse(1.6 * sc, 2.2 * sc, rx * 1.06, ry * 1.12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // corpo do elo (ferro queimado)
    const g = ctx.createLinearGradient(-rx, -ry, rx, ry);
    g.addColorStop(0, '#6b4a3a');
    g.addColorStop(0.42, '#38262a');
    g.addColorStop(1, '#20161a');
    ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = lw * sc; ctx.strokeStyle = '#160f11'; ctx.stroke();
    // furo interno
    ctx.beginPath(); ctx.ellipse(0.4 * sc, 0.4 * sc, rx * 0.5, ry * 0.48, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#150e10'; ctx.fill();
    ctx.lineWidth = 1.6 * sc; ctx.strokeStyle = '#4a3229'; ctx.stroke();
    // realces de ferrugem/ferro (luz superior esquerda)
    ctx.beginPath(); ctx.ellipse(-0.7 * sc, -1.0 * sc, rx * 0.9, ry * 0.84, 0, Math.PI * 1.04, Math.PI * 1.94);
    ctx.strokeStyle = '#c08a5c'; ctx.lineWidth = 2.2 * sc; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(-0.5 * sc, 0.7 * sc, rx * 0.88, ry * 0.82, 0, Math.PI * 0.1, Math.PI * 0.88);
    ctx.strokeStyle = '#6b4636'; ctx.lineWidth = 1.3 * sc; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 0, rx * 0.96, ry * 0.94, 0, Math.PI * 0.46, Math.PI * 0.6);
    ctx.strokeStyle = '#e0a06a'; ctx.lineWidth = 1.2 * sc; ctx.stroke();
    // mancha de ferrugem
    ctx.beginPath(); ctx.ellipse(rx * 0.28, ry * 0.3, rx * 0.3, ry * 0.26, 0.6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(110,52,26,0.5)'; ctx.fill();
    ctx.restore();
    const spr = { c, w: W, h: H, ss };
    linkSprites[key] = spr;
    return spr;
  }

  DS.drawChain = function (ctx, curve, opts) {    opts = opts || {};
    const pitch = opts.pitch || 26;
    const sc = opts.scale || 1;
    const lw = opts.lw || 3.4;
    const N = 260;
    const pts = [];
    let prev = curve.at(0);
    pts.push(prev);
    let acc = 0;
    for (let i = 1; i <= N; i++) {
      const p = curve.at(i / N);
      acc += Math.hypot(p[0] - prev[0], p[1] - prev[1]);
      if (acc >= pitch) { pts.push(p); prev = p; acc = 0; }
    }
    if (pts.length < 2) return;
    ctx.save();
    for (let i = 0; i < pts.length; i++) {
      const [x, y] = pts[i];
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
      const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
      const flat = i % 2 === 0;
      const spr = linkSprite(flat, sc, lw);
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(ang);
      ctx.drawImage(spr.c, -spr.w / 2, -spr.h / 2, spr.w, spr.h);
      ctx.restore();
    }
    ctx.restore();
  };

  /* pré-rasteriza os elos usados pela corrente dinâmica do herói */
  DS.warmChainSprites = function () {
    linkSprite(true, 1.15, 4.4); linkSprite(false, 1.15, 4.4);
    linkSprite(true, 0.9, 3.2); linkSprite(false, 0.9, 3.2);
  };

  /* Voltas de corrente no antebraço (frente/trás para oclusão correta).
   * Espaço local: origem no pulso, +x para o cotovelo (sentido do antebraço). */
  DS.drawForearmCoils = function (ctx, layer, opts) {
    opts = opts || {};
    const loops = opts.loops || 3;
    const len = opts.len || 108; // comprimento do antebraço disponível
    const thick = opts.thick || 30;
    for (let i = 0; i < loops; i++) {
      const t = loops === 1 ? 0 : i / (loops - 1);
      const x = 26 + t * (len - 30);
      const front = i % 2 === 0;
      if ((layer === 'front') !== front) continue;
      const ry = thick - t * 5;
      const curve = {
        at(u) {
          const a = -Math.PI * 0.9 + u * Math.PI * 2;
          return [x + Math.cos(a) * 8 + Math.sin(a * 1.4) * 2.4, Math.sin(a) * ry * (1 - 0.1 * Math.cos(a))];
        },
      };
      DS.drawChain(ctx, curve, { pitch: 24, scale: 0.9, lw: 3.2 });
    }
    // elo com folga pendurado sob o antebraço
    if (layer === 'front') {
      DS.drawChain(ctx, DS.chainPath(52, 24, 60, 64, 10), { pitch: 23, scale: 0.9, lw: 3.2 });
    }
  };
})(window.DS);

/* ---------- 05-skeleton.js ---------- */
/* ============================================================================
 * 05-skeleton.js — RIG HIERÁRQUICO + POSES PROCEDURAIS
 * Espaço do herói: origem na PELVE, -y para cima, herói desenhado de perfil
 * para a DIREITA (o espelhamento horizontal resolve a esquerda).
 * Ângulos em radianos no espaço da tela (0 = +x/direita, +pi/2 = baixo).
 * ========================================================================== */
(function (DS) {
  'use strict';

  const SK = DS.SK = {
    UPPER: 96, FORE: 96,
    THIGH: 180, SHIN: 150,
    SHOULDER: [192, -215],
    HIP: [112, -8],
    NECK: [0, -250],
    GROUND: 460,           // distância da pelve ao chão
    SOLE: 130,             // altura da sola abaixo do tornozelo (bota)
    BLADE_TIP: [272, -228], // ponta da lâmina no espaço local da arma (escalada)
    BLADE_MID: [192, -139],
  };

  /* ------------------------------------------------------------------ poses */
  const P = DS.POSE = {};

  function basePose() {
    return {
      py: 0, lean: 0, twist: 0, headYaw: -0.06, headPitch: 0,
      aR: [1.02, 0.10], wR: 0.35,
      aL: [2.10, -0.10], wL: -0.35,
      lR: [1.36, -0.06, 0.03], lL: [1.78, 0.06, -0.03],
      hip: 0,
    };
  }

  P.idle = function (t) {
    const p = basePose();
    const b = Math.sin(t * 1.9), b2 = Math.sin(t * 1.9 + 0.8);
    p.py = b * 3.2;
    p.lean = 0.022 + b * 0.014;
    p.aR = [1.02 + b * 0.035, 0.10 + b2 * 0.03];
    p.wR = 0.35 + b * 0.05;
    p.aL = [2.10 - b * 0.035, -0.10 - b2 * 0.03];
    p.wL = -0.35 - b * 0.05;
    p.lR = [1.36, -0.06 - b * 0.012, 0.03];
    p.lL = [1.78, 0.06 + b * 0.012, -0.03];
    p.headYaw = -0.06 + b * 0.03;
    return p;
  };

  P.walk = function (t, speed) {
    const p = basePose();
    const ph = t * 7.4;
    const sw = Math.sin(ph), cw = Math.cos(ph);
    p.py = -Math.abs(cw) * 5;
    p.lean = 0.09;
    p.lR = [1.36 + sw * 0.46, -0.06 - Math.max(0, -sw) * 0.55, 0.06 + Math.max(0, sw) * 0.25];
    p.lL = [1.78 - sw * 0.46, 0.06 + Math.max(0, sw) * 0.55, -0.06 - Math.max(0, -sw) * 0.25];
    p.aR = [1.02 - sw * 0.14, 0.10];
    p.aL = [2.10 + sw * 0.14, -0.10];
    p.wR = 0.35 + sw * 0.06;
    p.wL = -0.35 - sw * 0.06;
    p.headYaw = -0.06;
    return p;
  };

  P.run = function (t, speed) {
    const p = basePose();
    const ph = t * 10.2;
    const sw = Math.sin(ph), cw = Math.cos(ph);
    p.py = -Math.abs(cw) * 11 - 4;
    p.lean = 0.26;
    p.lR = [1.36 + sw * 0.78, -0.16 - Math.max(0, -sw) * 0.95, 0.10 + Math.max(0, sw) * 0.3];
    p.lL = [1.78 - sw * 0.78, 0.16 + Math.max(0, sw) * 0.95, -0.10 - Math.max(0, -sw) * 0.3];
    p.aR = [1.02 - sw * 0.3, 0.18];
    p.aL = [2.10 + sw * 0.3, -0.18];
    p.headYaw = -0.02;
    return p;
  };

  function mix(a, b, k) { return a + (b - a) * k; }
  function mixPose(p, q, k) {
    const o = {};
    for (const key in p) {
      const a = p[key], b = q[key];
      if (typeof a === 'number') o[key] = mix(a, b, k);
      else if (Array.isArray(a)) o[key] = a.map((v, i) => mix(v, b[i], k));
      else o[key] = b === undefined ? a : (k < 0.5 ? a : b);
    }
    return o;
  }
  DS.mixPose = mixPose;

  /* Ataques: curvas explícitas (u = 0..1) */
  P.attack = function (u, idx) {
    const p = basePose();
    const wave = (a, b) => DS.smooth(DS.clamp((u - a) / (b - a), 0, 1));
    const back = 0.22;   // fim do windup
    const hit = 0.48;    // fim do golpe
    const w = wave(0, back), s = wave(back, hit), r = wave(hit, 1);
    /* Convenção de ângulos (herói olhando para +x):
     *   braço: 0 = para frente, +PI/2 = para baixo, -PI/2 = para cima, PI = para trás
     *   arma (wa): ponta direita = wa - 0.72 rad   /   ponta esquerda = -2.43 - wa
     * Regra de ouro: a PONTA descreve um arco grande e legível na tela. */
    if (idx === 0) {
      // A1 — corte horizontal com a adaga direita: ponta de trás-cima -> frente
      p.lean = -0.14 * w + 0.34 * s - 0.20 * r;
      p.py = -3 * s;
      p.aR = [1.02 - 1.57 * w + 1.77 * s + 0.08 * r, 0.10 + 1.15 * w - 1.13 * s + 0.30 * r];
      p.wR = -0.67 - 1.23 * w + 2.20 * s + 0.30 * r;
      p.aL = [2.10 + 0.30 * w - 0.35 * s, -0.10 - 0.20 * w + 0.25 * s];
      p.wL = -1.77 - 0.25 * w + 0.20 * s;
      p.headYaw = -0.06 - 0.18 * w + 0.34 * s;
      p.lR = [1.30 - 0.10 * w + 0.16 * s, -0.06 - 0.10 * w, 0.03];
      p.lL = [1.84 + 0.10 * w + 0.10 * s, 0.06 + 0.12 * w, -0.03];
      p.twist = -0.14 * w + 0.24 * s;
    } else if (idx === 1) {
      // A2 — backhand ascendente com a adaga esquerda: ponta de baixo-trás -> frente-cima
      p.lean = 0.16 * w - 0.30 * s;
      p.py = -5 * s;
      p.aL = [2.10 + 0.45 * w - 2.20 * s + 0.10 * r, -0.10 + 0.25 * w + 0.20 * s];
      p.wL = -1.77 - 3.26 * w + 3.15 * s + 0.38 * r;
      p.aR = [1.02 + 0.15 * w - 0.25 * s + 0.15 * r, 0.10 + 0.10 * w];
      p.wR = -0.67 - 0.35 * w + 0.25 * s;
      p.headYaw = 0.20 * w - 0.25 * s;
      p.lR = [1.32 - 0.06 * w, -0.06, 0.03];
      p.lL = [1.82 + 0.12 * w - 0.20 * s, 0.06, -0.03];
      p.twist = 0.16 * w - 0.26 * s;
    } else {
      // A3 — golpe duplo descendente: as duas pontas caem juntas de cima
      p.lean = -0.30 * w + 0.60 * s - 0.30 * r;
      p.py = 10 * w - 26 * s + 8 * r;
      p.aR = [1.02 - 2.12 * w + 2.45 * s - 0.15 * r, 0.10 + 0.95 * w - 0.95 * s];
      p.wR = -0.67 - 1.16 * w + 3.10 * s - 0.40 * r;
      p.aL = [2.10 - 2.65 * w + 1.70 * s - 0.20 * r, -0.10 - 0.85 * w + 0.95 * s];
      p.wL = -1.77 + 0.84 * w - 2.90 * s + 0.50 * r;
      p.headYaw = -0.06 - 0.10 * s;
      p.lR = [1.42 - 0.26 * w + 0.30 * s, -0.10 - 0.22 * w + 0.26 * s, 0.03];
      p.lL = [1.72 - 0.26 * w + 0.30 * s, 0.10 - 0.26 * w + 0.30 * s, -0.03];
    }
    return p;
  };

  P.roll = function (u) {
    const p = basePose();
    const k = DS.smooth(u);
    p.py = -Math.sin(u * Math.PI) * 40;
    p.lean = 0.9 * Math.sin(u * Math.PI);
    p.aR = [0.6, 1.1]; p.aL = [2.5, -1.1];
    p.wR = -1.25; p.wL = -1.95;
    p.lR = [1.9, -1.5, 0.3];
    p.lL = [1.3, -1.3, 0.2];
    p.tuck = k;
    return p;
  };

  P.hurt = function (u) {
    const p = basePose();
    const k = Math.sin(Math.min(1, u) * Math.PI);
    p.lean = -0.35 * k;
    p.py = -6 * k;
    p.headPitch = -0.3 * k;
    p.aR = [1.2 + 0.3 * k, 0.2]; p.aL = [1.95 - 0.3 * k, -0.2];
    p.wR = -0.67 - 0.3 * k; p.wL = -1.77 + 0.3 * k;
    return p;
  };

  /* --------------------------------------------------------------------- FK */
  DS.fk = function (p) {
    const c = Math.cos(p.lean || 0), s = Math.sin(p.lean || 0);
    const rot = (x, y) => [x * c - y * s, x * s + y * c];
    const pelvis = [0, p.py || 0];
    const neckL = rot(SK.NECK[0], SK.NECK[1]);
    const neck = [pelvis[0] + neckL[0], pelvis[1] + neckL[1]];
    const shR = rot(SK.SHOULDER[0], SK.SHOULDER[1]);
    /* O braço de trás (esquerdo) fica 34 u mais para fora e 6 u abaixo: sem isso
     * o tronco largo do chibi esconde quase todo o braço/arma na vista 3/4. */
    const shL = rot(-SK.SHOULDER[0] - 34, SK.SHOULDER[1] + 6);
    const shoulderR = [pelvis[0] + shR[0] + (p.twist || 0) * 60, pelvis[1] + shR[1]];
    const shoulderL = [pelvis[0] + shL[0] + (p.twist || 0) * 60, pelvis[1] + shL[1]];
    const hipL = rot(-SK.HIP[0], SK.HIP[1]);
    const hipR = rot(SK.HIP[0], SK.HIP[1]);
    const hipRP = [pelvis[0] + hipR[0], pelvis[1] + hipR[1]];
    const hipLP = [pelvis[0] + hipL[0], pelvis[1] + hipL[1]];

    const elbow = (sh, a) => [sh[0] + Math.cos(a) * SK.UPPER, sh[1] + Math.sin(a) * SK.UPPER];
    const wrist = (el, a) => [el[0] + Math.cos(a) * SK.FORE, el[1] + Math.sin(a) * SK.FORE];
    const elR = elbow(shoulderR, p.aR[0]);
    const elL = elbow(shoulderL, p.aL[0]);
    const wrR = wrist(elR, p.aR[0] + p.aR[1]);
    const wrL = wrist(elL, p.aL[0] + p.aL[1]);

    const knee = (hp, a) => [hp[0] + Math.cos(a) * SK.THIGH, hp[1] + Math.sin(a) * SK.THIGH];
    const ankle = (kn, a) => [kn[0] + Math.cos(a) * SK.SHIN, kn[1] + Math.sin(a) * SK.SHIN];
    const knR = knee(hipRP, p.lR[0]);
    const knL = knee(hipLP, p.lL[0]);
    const anR = ankle(knR, p.lR[0] + p.lR[1]);
    const anL = ankle(knL, p.lL[0] + p.lL[1]);

    return {
      pelvis, neck, shoulderR, shoulderL, elbowR: elR, elbowL: elL, wristR: wrR, wristL: wrL,
      hipR: hipRP, hipL: hipLP, kneeR: knR, kneeL: knL, ankleR: anR, ankleL: anL,
      headRot: (p.lean || 0) * 0.55 + (p.headPitch || 0),
      torsoTop: [neck[0], neck[1]],
    };
  };

  /* Ponta/miolo da lâmina no espaço do herói (para hitbox e rastro) */
  DS.bladePoints = function (wrist, rot) {
    const c = Math.cos(rot), s = Math.sin(rot);
    const tf = (x, y) => [wrist[0] + x * c - y * s, wrist[1] + x * s + y * c];
    return { root: tf(60, -8), mid: tf(SK.BLADE_MID[0], SK.BLADE_MID[1]), tip: tf(SK.BLADE_TIP[0], SK.BLADE_TIP[1]) };
  };
})(window.DS);

/* ---------- 06-hero.js ---------- */
/* ============================================================================
 * 06-hero.js — MONTAGEM DO HERÓI (rig + armas + correntes) com cache offscreen
 * O herói é desenhado de perfil para a DIREITA; opts.facing = -1 espelha.
 * O mesmo renderer procedural desenha parado e atacando (sem sprites).
 * ========================================================================== */
(function (DS) {
  'use strict';
  const SK = DS.SK;

  /* Cache de peças (bitmaps offscreen determinísticos). */
  function mkPart(key, bounds, fn, ss) {
    const [x0, y0, x1, y1] = bounds;
    return DS.part(key, { w: x1 - x0, h: y1 - y0, px: -x0, py: -y0, ss: ss || 2, draw: fn });
  }

  function yawBucket(yaw) {
    const q = Math.round(DS.clamp(yaw, -1, 1) * 2) / 2; // -1, -0.5, 0, 0.5, 1
    return q;
  }

  function headPart(bucket) {
    return mkPart('head|' + bucket, [-620, -940, 620, 140], (ctx) => {
      DS.drawHead(ctx, { yaw: bucket });
    }, 1.6);
  }
  function bodyPart(bucket) {
    return mkPart('body|' + bucket, [-520, -360, 520, 480], (ctx) => {
      ctx.scale(1.1, 1.0);
      DS.drawBody(ctx, { yaw: bucket, t: 0 });
    }, 1.5);
  }
  function upperPart(side) {
    return mkPart('uarm|' + side, [-50, -90, 150, 90], (ctx) => {
      ctx.scale(1.06, 1.5);
      DS.drawUpperArm(ctx, side);
    }, 2);
  }
  function forePart(side) {
    return mkPart('farm|' + side, [-40, -78, 130, 78], (ctx) => {
      ctx.scale(1.02, 1.45);
      DS.drawForearm(ctx, side);
    }, 2);
  }
  function thighPart(side) {
    return mkPart('thigh|' + side, [-60, -104, 210, 106], (ctx) => DS.drawThigh(ctx, side), 2);
  }
  function shinPart(side) {
    return mkPart('shin|' + side, [-50, -84, 180, 84], (ctx) => DS.drawShin(ctx, side), 2);
  }
  function bootPart(side) {
    return mkPart('boot|' + side, [-120, -160, 200, 200], (ctx) => DS.drawBoot(ctx, side), 1.6);
  }
  /* Arma + mão: a adaga é o desenho mais caro do jogo (centenas de paths,
   * clip(), lava e correntes). Como é RÍGIDA em relação ao punho, pinta-se
   * uma vez em offscreen e o quadro só faz um drawImage rotacionado. */
  function weaponPart(side) {
    return mkPart('weapon|' + (side > 0 ? 'r' : 'l'), [-160, -360, 360, 180], (ctx) => {
      DS.drawHandGrip(ctx, 1, 'back');
      DS.drawWeapon(ctx, side, {});
      DS.drawHandGrip(ctx, 1, 'front');
    }, 1.25);
  }

  /* posição de um ponto local da arma no espaço do herói */
  function wpos(side, wrist, wa, lx, ly) {
    const c = Math.cos(wa), s = Math.sin(wa);
    const X = lx * c - ly * s, Y = lx * s + ly * c;
    return [wrist[0] + (side < 0 ? -X : X), wrist[1] + Y];
  }
  DS.wpos = wpos;

  DS.bladeWorld = function (side, wrist, wa) {
    return {
      root: wpos(side, wrist, wa, 60, -8),
      mid: wpos(side, wrist, wa, SK.BLADE_MID[0], SK.BLADE_MID[1]),
      tip: wpos(side, wrist, wa, SK.BLADE_TIP[0], SK.BLADE_TIP[1]),
      pommel: wpos(side, wrist, wa, -74, 14),
    };
  };

  /* Arma + mão + corrente */
  function drawArmWeapon(ctx, side, f, pose, wa, layer) {
    const wrist = side > 0 ? f.wristR : f.wristL;
    const elbow = side > 0 ? f.elbowR : f.elbowL;
    // braço
    const a1 = side > 0 ? pose.aR[0] : pose.aL[0];
    const a2 = side > 0 ? pose.aR[1] : pose.aL[1];
    const sh = side > 0 ? f.shoulderR : f.shoulderL;
    ctx.save();
    ctx.translate(sh[0], sh[1]);
    ctx.rotate(a1);
    upperPart(side).blit(ctx);
    ctx.translate(SK.UPPER, 0);
    ctx.rotate(a2);
    forePart(side).blit(ctx);
    ctx.restore();

    // arma na mão (bitmap cacheado: a mesma arte procedural desenhada uma vez)
    ctx.save();
    ctx.translate(wrist[0], wrist[1]);
    if (side < 0) ctx.scale(-1, 1);
    ctx.rotate(wa);
    weaponPart(side).blit(ctx);
    ctx.restore();

    // corrente do pomo ao antebraço: laço pesado, com folga grande (como a folha)
    const bp = DS.bladeWorld(side, wrist, wa);
    const mx = (elbow[0] + wrist[0]) / 2, my = (elbow[1] + wrist[1]) / 2;
    const d = Math.hypot(bp.pommel[0] - mx, bp.pommel[1] - my);
    const sag = 44 + d * 0.5;
    ctx.save();
    DS.drawChain(ctx, DS.chainPath(bp.pommel[0], bp.pommel[1], mx, my + 6, sag), { pitch: 30, scale: 1.15, lw: 4.4 });
    ctx.restore();
  }

  function drawLeg(ctx, side, f, pose) {
    const hip = side > 0 ? f.hipR : f.hipL;
    const l = side > 0 ? pose.lR : pose.lL;
    ctx.save();
    ctx.translate(hip[0], hip[1]);
    ctx.rotate(l[0]);
    thighPart(side).blit(ctx);
    ctx.translate(SK.THIGH, 0);
    ctx.rotate(l[1]);
    shinPart(side).blit(ctx);
    ctx.restore();
  }

  /* Bota no espaço do herói: ancorada no tornozelo, sola sempre plana. */
  function drawBoot(ctx, side, f, pose) {
    const an = side > 0 ? f.ankleR : f.ankleL;
    const l = side > 0 ? pose.lR : pose.lL;
    const tilt = DS.clamp((l[0] + l[1] - Math.PI / 2) * 0.5, -0.55, 0.55);
    ctx.save();
    ctx.translate(an[0], an[1]);
    ctx.rotate(tilt);
    bootPart(side).blit(ctx);
    ctx.restore();
  }

  /* Pré-aquece todos os bitmaps (evita hitch no primeiro quadro / no 1º ataque) */
  DS.warmup = function () {
    for (const b of [0.5, 0]) { headPart(b).ensure(); bodyPart(b).ensure(); }
    for (const s of [1, -1]) {
      upperPart(s).ensure(); forePart(s).ensure();
      thighPart(s).ensure(); shinPart(s).ensure(); bootPart(s).ensure();
      weaponPart(s).ensure();
    }
    if (DS.warmChainSprites) DS.warmChainSprites();
  };

  /* ------------------------------------------------------------------ API */
  DS.drawHero = function (ctx, opts) {
    opts = opts || {};
    const pose = opts.pose || DS.POSE.idle(0);
    const facing = opts.facing == null ? 1 : (opts.facing < 0 ? -1 : 1);
    const yaw = opts.yaw == null ? 0.25 : opts.yaw;
    const bucket = yawBucket(yaw);
    const f = DS.fk(pose);
    const only = opts.only || 'all';
    const want = (k) => only === 'all' || only === k;

    ctx.save();
    if (opts.x || opts.y) ctx.translate(opts.x || 0, opts.y || 0);
    if (facing < 0) ctx.scale(-1, 1);

    // as duas pernas primeiro: o pano da cintura cobre as duas coxas
    if (want('legs') || only === 'legR' || only === 'legL') {
      if (want('legs') || only === 'legL') drawLeg(ctx, -1, f, pose);
      if (want('legs') || only === 'legR') drawLeg(ctx, 1, f, pose);
      if (want('legs') || only === 'legL') drawBoot(ctx, -1, f, pose);
      if (want('legs') || only === 'legR') drawBoot(ctx, 1, f, pose);
    }

    // braço de trás (na frente do tronco quando está golpeando: o arco precisa ler)
    if (!opts.frontArms && (want('arms') || only === 'armL')) drawArmWeapon(ctx, -1, f, pose, pose.wL, 'back');

    // tronco
    if (want('body')) {
      ctx.save();
      ctx.translate(0, pose.py);
      ctx.rotate(pose.lean);
      bodyPart(bucket).blit(ctx);
      ctx.restore();
    }

    if (opts.frontArms && (want('arms') || only === 'armL')) drawArmWeapon(ctx, -1, f, pose, pose.wL, 'back');

    // cabeça
    if (want('head')) {
      ctx.save();
      ctx.translate(f.neck[0], f.neck[1]);
      ctx.rotate(f.headRot);
      // leve inclinação de "olhar" (yaw) desloca a cabeça
      ctx.translate(-(pose.headYaw || 0) * 14, 0);
      ctx.scale(0.9, 0.9);
      headPart(bucket).blit(ctx);
      ctx.restore();
    }

    // braço da frente
    if (want('arms') || only === 'armR') drawArmWeapon(ctx, 1, f, pose, pose.wR, 'front');

    ctx.restore();
    return f;
  };

  /* Desenha só a silhueta de colisão/depuração */
  DS.heroDebug = function (ctx, pose, facing) {
    const f = DS.fk(pose);
    ctx.save();
    if (facing < 0) ctx.scale(-1, 1);
    ctx.strokeStyle = 'rgba(0,255,180,0.75)';
    ctx.lineWidth = 2;
    const seg = (a, b) => { ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); };
    seg(f.pelvis, f.neck);
    seg(f.shoulderR, f.elbowR); seg(f.elbowR, f.wristR);
    seg(f.shoulderL, f.elbowL); seg(f.elbowL, f.wristL);
    seg(f.hipR, f.kneeR); seg(f.kneeR, f.ankleR);
    seg(f.hipL, f.kneeL); seg(f.kneeL, f.ankleL);
    ctx.restore();

/* ---------- 07-arena.js ---------- */
/* ============================================================================
 * 07-arena.js — ARENA DA ILHA (chão + cenário), 3/4 fake 2.5D
 * O chão é pintado UMA VEZ num buffer offscreen (draw call constante por frame).
 * Os props são peças em cache com sombra e ordenação por Y (profundidade).
 * Nada aqui usa imagem externa: tudo é geometria + pintura procedural.
 * Referência de composição: assets/references/ref-2d-maps/map-island-enemys.png
 * ========================================================================== */
(function (DS) {
  'use strict';

  const A = DS.arena = {
    W: 6000, H: 3800,       // tamanho do mundo em unidades do herói
    BS: 0.24,
    BS: 0.24,               // resolução do buffer de chão (igual ao zoom do jogo = blit 1:1)
    BAKE: 0.36,             // escala em que as peças de cenário são rasterizadas (nitidez x memória)
    SAND_X: 900,            // praia a oeste até este x
    SEA_X: 330,
    ground: null,
    props: [],
  };

  /* ------------------------------------------------------------- pinturas */
  function paintWater(ctx, x0, y0, x1, y1, rnd) {
    const g = ctx.createLinearGradient(x0, 0, x1, 0);
    g.addColorStop(0, '#2b7fa6');
    g.addColorStop(0.55, '#4aa8bd');
    g.addColorStop(1, '#7fd0cf');
    ctx.fillStyle = g;
    ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    // faixas de onda
    for (let i = 0; i < 90; i++) {
      const y = y0 + rnd() * (y1 - y0);
      const x = x0 + rnd() * (x1 - x0);
      const len = 30 + rnd() * 130;
      ctx.globalAlpha = 0.1 + rnd() * 0.25;
      ctx.strokeStyle = rnd() < 0.5 ? '#dff6f4' : '#1d6a91';
      ctx.lineWidth = 1 + rnd() * 2.6;
      ctx.beginPath();
      ctx.moveTo(x - len / 2, y);
      ctx.quadraticCurveTo(x, y - 3 - rnd() * 6, x + len / 2, y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // espuma na areia
    for (let i = 0; i < 40; i++) {
      const y = y0 + rnd() * (y1 - y0);
      const x = x1 - 6 - rnd() * 46;
      ctx.globalAlpha = 0.25 + rnd() * 0.4;
      ctx.fillStyle = '#f2fbf8';
      ctx.beginPath();
      ctx.ellipse(x, y, 8 + rnd() * 26, 2 + rnd() * 5, 0, 0, 6.3);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function paintSand(ctx, x0, x1, W, H, rnd) {
    const g = ctx.createLinearGradient(x0, 0, x1, 0);
    g.addColorStop(0, '#e6d3a4');
    g.addColorStop(0.6, '#d8c088');
    g.addColorStop(1, '#c2a896');
    ctx.fillStyle = g;
    // borda irregular entre areia e grama
    ctx.beginPath();
    ctx.moveTo(x0, 0);
    for (let y = 0; y <= H; y += 40) {
      const x = x1 - 40 + Math.sin(y * 0.011) * 46 + rnd() * 30;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(x0, H);
    ctx.closePath();
    ctx.fill();
    // grãos e marcas
    for (let i = 0; i < 900; i++) {
      const x = x0 + rnd() * (x1 - x0);
      const y = rnd() * H;
      ctx.globalAlpha = 0.1 + rnd() * 0.3;
      ctx.fillStyle = rnd() < 0.5 ? '#f4e6bf' : '#a88f62';
      ctx.beginPath();
      ctx.ellipse(x, y, 1 + rnd() * 3, 1 + rnd() * 2, rnd() * 3, 0, 6.3);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function paintGrass(ctx, x0, y0, x1, y1, rnd) {
    ctx.fillStyle = '#3f6b32';
    ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    // manchas grandes de tom
    for (let i = 0; i < 420; i++) {
      const x = x0 + rnd() * (x1 - x0), y = y0 + rnd() * (y1 - y0);
      const r = 26 + rnd() * 110;
      ctx.globalAlpha = 0.10 + rnd() * 0.2;
      ctx.fillStyle = rnd() < 0.33 ? '#4f8040' : (rnd() < 0.55 ? '#2f5527' : '#5f9448');
      ctx.beginPath();
      ctx.ellipse(x, y, r, r * (0.5 + rnd() * 0.6), rnd() * 3, 0, 6.3);
      ctx.fill();
    }
    // tufos de capim
    for (let i = 0; i < 26000; i++) {
      const x = x0 + rnd() * (x1 - x0), y = y0 + rnd() * (y1 - y0);
      if (x < A.SAND_X + 30) continue;
      ctx.globalAlpha = 0.25 + rnd() * 0.5;
      ctx.strokeStyle = rnd() < 0.42 ? '#79b45c' : (rnd() < 0.6 ? '#2c4f24' : '#93c46a');
      ctx.lineWidth = 1.4 + rnd() * 2.4;
      const h = 8 + rnd() * 26, a = -1.6 + rnd() * 0.7;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + Math.cos(a) * h * 0.5, y + Math.sin(a) * h * 0.5, x + Math.cos(a + 0.5) * h, y + Math.sin(a + 0.5) * h);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // terra / folhas caídas
    for (let i = 0; i < 900; i++) {
      const x = x0 + rnd() * (x1 - x0), y = y0 + rnd() * (y1 - y0);
      if (x < A.SAND_X) continue;
      ctx.globalAlpha = 0.12 + rnd() * 0.3;
      ctx.fillStyle = rnd() < 0.5 ? '#2b2418' : '#7a5a2c';
      ctx.beginPath();
      ctx.ellipse(x, y, 4 + rnd() * 22, 3 + rnd() * 11, rnd() * 3, 0, 6.3);
      ctx.fill();
    }
    // flores e pedrinhas
    for (let i = 0; i < 260; i++) {
      const x = x0 + rnd() * (x1 - x0), y = y0 + rnd() * (y1 - y0);
      if (x < A.SAND_X) continue;
      const r = 3 + rnd() * 5;
      ctx.globalAlpha = 0.5 + rnd() * 0.4;
      ctx.fillStyle = rnd() < 0.4 ? '#f0d060' : (rnd() < 0.6 ? '#e07a9a' : '#cfd6c0');
      for (let p = 0; p < 5; p++) {
        const a = p / 5 * 6.283;
        ctx.beginPath(); ctx.ellipse(x + Math.cos(a) * r, y + Math.sin(a) * r * 0.6, r * 0.7, r * 0.45, a, 0, 6.3); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  /* Caminho de terra batida ligando a praia ao interior. */
  function paintPath(ctx, rnd) {
    ctx.save();
    ctx.globalAlpha = 0.72;
    ctx.fillStyle = '#9c7f56';
    ctx.beginPath();
    const HW = 150;
    const pts = [
      [A.SEA_X - 40, 2150], [1200, 2020], [2400, 2080], [3500, 1900], [4600, 1860], [A.W + 100, 1780],
    ];
    ctx.moveTo(pts[0][0], pts[0][1] - HW);
    for (let i = 1; i < pts.length; i++) {
      ctx.quadraticCurveTo((pts[i - 1][0] + pts[i][0]) / 2, pts[i][1] - HW - 40, pts[i][0], pts[i][1] - HW + 20);
    }
    for (let i = pts.length - 1; i >= 0; i--) {
      const prev = pts[Math.max(0, i - 1)];
      ctx.quadraticCurveTo((pts[i][0] + prev[0]) / 2, pts[i][1] + HW + 40, pts[i][0], pts[i][1] + HW - 20);
    }
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 0.5;
    for (let i = 0; i < 2200; i++) {
      const t = rnd(), x = A.SEA_X + t * (A.W - A.SEA_X) + (rnd() - 0.5) * 420;
      const y = 2000 - t * 260 + (rnd() - 0.5) * 400;
      ctx.globalAlpha = 0.1 + rnd() * 0.35;
      ctx.fillStyle = rnd() < 0.5 ? '#7b6141' : '#c0a271';
      ctx.beginPath();
      ctx.ellipse(x, y, 4 + rnd() * 24, 3 + rnd() * 12, rnd() * 3, 0, 6.3);
      ctx.fill();
    }
    ctx.restore();
  }

  /* -------------------------------------------------------- peças de cenário */
  function palmPart(id, h, seed) {

      w: 660, h: h + 420, px: 330, py: h + 40, ss: A.BAKE,

        trunk.C(14, -H * 1.04, 30, -H * 1.06, 40, -H * 0.98);
        trunk.C(30, -H * 0.66, 12, -H * 0.3, 26, 0);
        trunk.Z();
        DS.wash(ctx, trunk, {
          kind: 'wood', base: '#6b5636', shadow: '#332415', deep: '#1e1610', seed: seed + 1,

        for (let i = 0; i < 12; i++) {

          ctx.beginPath();

          ctx.quadraticCurveTo(0, y + 6, w * 0.9, y + (i % 2 ? 4 : -4));
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        // folhas (palmas) no topo
        const top = [20, -H * 1.0];

  function rockPart(id, seed, big) {

    return DS.part('rock|' + id, {
      w: S * 1.6, h: S * 1.5, px: S * 0.8, py: S * 1.1, ss: A.BAKE,

  function torchPart(id, seed) {

  /* desenha o chão dentro da câmera (em pixels de tela, sem transformação)
   * cam = {x,y} canto superior esquerdo do mundo visível (unidades do herói) */
  A.drawGround = function (ctx, cam, w, h, view) {
    A.init();
    const S = A.BS;
    const sx = DS.clamp(cam.x, 0, Math.max(0, A.W - view)), sy = DS.clamp(cam.y, 0, Math.max(0, A.H - view));

    ctx.drawImage(A.ground, Math.round(sx * S), Math.round(sy * S), w, h, 0, 0, w, h);
    ctx.imageSmoothingEnabled = true;
    return { sx, sy };
  };

  A.drawProps = function (ctx, cam, viewW, viewH, splitY, behind) {
    const x0 = cam.x - 900, x1 = cam.x + viewW + 900;
    const y0 = cam.y - 1700, y1 = cam.y + viewH + 700;
    for (const p of A.props) {

      ctx.save();
      ctx.translate(p.x - cam.x, p.y - cam.y);
      if (p.flip) ctx.scale(-1, 1);
      ctx.scale(p.sc, p.sc);
      p.part.blit(ctx);
      ctx.restore();
    }
