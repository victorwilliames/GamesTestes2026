<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cavaleiro — Piloto de RPG Isométrico</title>
<style>
  :root { --ink: #16111c; --paper: #fff7e6; --gold: #ffd23f; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #143a4f; }
  canvas { display: block; }
  #game { position: fixed; inset: 0; width: 100vw; height: 100vh; cursor: none; }
  #portrait { position: fixed; left: 10px; top: 8px; pointer-events: none; }
  .caption {
    position: fixed; pointer-events: none; color: var(--ink);
    font: italic 900 15px/1.25 Impact, "Arial Black", "Helvetica Neue", sans-serif; letter-spacing: 0.5px;
    background: var(--paper); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
    padding: 7px 12px; text-transform: uppercase;
  }
  #title { right: 18px; top: 16px; transform: rotate(1.5deg); background: var(--gold); font-size: 19px; }
  #title small { display: block; font: 700 11px/1.3 "Trebuchet MS", system-ui, sans-serif; letter-spacing: 0.3px; text-transform: none; font-style: normal; }
  #help { left: 18px; bottom: 16px; transform: rotate(-1deg); font-size: 14px; }
  #help b { display: inline-block; background: var(--ink); color: var(--paper); padding: 0 6px; margin: 0 2px; border-radius: 2px; font-style: normal; }
  #help span { margin-right: 14px; }
  #toast {
    left: 50%; top: 18px; transform: translateX(-50%) scale(0.9); opacity: 0; transition: opacity .15s, transform .15s;
    background: #79dcff; font-size: 15px;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) scale(1); }
  #loading {
    position: fixed; inset: 0; display: grid; place-items: center; background: #143a4f; z-index: 5;
    transition: opacity .35s;
  }
  #loading.hide { opacity: 0; pointer-events: none; }
  #loading div { font: italic 900 26px Impact, "Arial Black", sans-serif; color: var(--ink); background: var(--gold); border: 4px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 12px 20px; transform: rotate(-2deg); }
  @media (max-width: 700px) { #help { font-size: 11px; } #title { display: none; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="portrait"></canvas>
<div id="title" class="caption">Campo de Treino<small>Canvas 2D · esqueleto 3D + IK · tudo desenhado por código</small></div>
<div id="help" class="caption"><span><b>W</b><b>A</b><b>S</b><b>D</b> mover</span><span><b>Clique</b> combo de 3 golpes</span><span><b>B</b> esqueleto</span><span><b>T</b> câmera lenta</span></div>
<div id="toast" class="caption"></div>
<div id="loading"><div>Pintando o campo…</div></div>

<script src="js/core.js"></script>
<script src="js/ink.js"></script>
<script src="js/rig.js"></script>
<script src="js/head.js"></script>
<script src="js/knight.js"></script>
<script src="js/world.js"></script>
<script src="js/fx.js"></script>
<script src="js/main.js"></script>
</body>
</html>
